# ⚠️ ต้องเป็น true (แก้ 18 ก.ย. 69 หลังเพิ่มล็อกอิน Google ในแอป)
# เหตุผล: play-services-auth 21.2.0 ใน dependency มีไลบรารี androidx ปนมาด้วย
#   ถ้าปิดไว้ build จะล้มด้วยข้อความ:
#   "Configuration ':app:releaseRuntimeClasspath' contains AndroidX dependencies,
#    but the `android.useAndroidX` property is not enabled"
# ตัวโค้ดของแอปเองยังเป็น android.* ล้วน (Activity/Service/WebView) — การเปิดสวิตช์นี้
# แค่ยอมให้ "มี" ไลบรารี androidx อยู่ใน classpath ไม่ได้บังคับให้เขียนโค้ดใหม่
android.useAndroidX=true
# ไม่ต้องใช้ Jetifier: ของที่ดึงมา (play-services-auth + androidx.*) เป็น androidx อยู่แล้ว
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
