plugins {
    id 'com.android.application'
}

// 🔐 ลายเซ็น APK — อ่านจากตัวแปรสภาพแวดล้อม (GitHub Actions ส่งมาจาก Secrets)
//    ไม่มี keystore = build ได้ แต่ APK จะยังไม่เซ็น (ใช้ทดสอบเท่านั้น · ติดตั้งทับของเดิมไม่ได้)
//
// ⚠️ กับดักที่ทำให้ได้ APK “unsigned” เงียบ ๆ (18 ก.ย. 2026):
//    ถ้าใช้ file('keys/keystore.jks') เฉย ๆ มันจะหาจากโฟลเดอร์ของโมดูล app/ ไม่ใช่รากโปรเจกต์
//    ⇒ หาไฟล์ไม่เจอ → ไม่เข้าเงื่อนไขเซ็น → พาสร้าง app-release-**unsigned**.apk → ติดตั้งบนมือถือไม่ได้
//    ⇒ ต้องอิงกับรากโปรเจกต์ (rootProject) เสมอ ไม่ว่าไฟล์จะอยู่ที่ไหน
def ksRaw = System.getenv('TAXI_KEYSTORE') ?: 'keys/keystore.jks'
def ksFile = new File(ksRaw).isAbsolute() ? new File(ksRaw) : rootProject.file(ksRaw)
def ksStorePass = System.getenv('TAXI_STORE_PASSWORD')
def ksKeyAlias = System.getenv('TAXI_KEY_ALIAS') ?: 'taxi'
def ksKeyPass = System.getenv('TAXI_KEY_PASSWORD') ?: ksStorePass
def hasKeystore = ksFile.exists() && ksStorePass

android {
    namespace 'com.baby4bot.taximeter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.baby4bot.taximeter'
        minSdk 26          // Android 8.0 ขึ้นไป (พอสำหรับ WebView + Foreground Service ที่ทำงานถูกต้อง)
        targetSdk 34
        // 🔢 เพิ่ม versionCode ทุกครั้งที่จะแจก APK ใหม่ (มือถือใช้ตัวนี้บอกว่า "มีตัวใหม่กว่า")
        //    v1.2.0 (3) = เพิ่มล็อกอิน Google แบบ native (Google บล็อกหน้า OAuth ในเว็บวิว ⇒ ต้องทำในชั้นแอป)
        versionCode 3
        versionName '1.2.0'   // ชื่อแอป "ค่าแท็กซี่" + ไอคอนรูป taxi + ล็อกอิน Google ในแอปได้

        // 🌐 URL ของเว็บแอป — จุดเดียวที่ต้องแก้ถ้าย้ายโดเมน
        //    แก้ชั่วคราวจากในแอปได้ด้วย TaxiNative.setAppUrl('http://192.168.x.x:58911/') เพื่อทดสอบกับเซิร์ฟเวอร์ในเครื่อง
        buildConfigField 'String', 'APP_URL', '"https://baby4bot.github.io/taxi/"'
    }

    // ให้ MainActivity อ่าน BuildConfig.APP_URL / DEBUG ได้
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile ksFile
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // ใช้เซ็นด้วย debug key ของเครื่อง — ติดตั้งทดสอบได้ แต่ห้ามใช้แจกให้คนขับ
            applicationIdSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// ⛔ ไม่มี dependencies โดยเจตนา — ใช้ API ของ framework ล้วน ๆ
//    (ไม่ต้องใช้ Google Play Services/AndroidX ⇒ build ไม่พังง่าย และติดตั้งได้ทุกเครื่อง)
//    ยกเว้นข้อเดียวที่จำเป็นจริง: play-services-auth สำหรับ “ล็อกอิน Google ในแอป”
//    เพราะ Google ห้ามหน้า OAuth ใน WebView ⇒ ต้องขอ idToken จากชั้นแอปแล้วส่งเข้า Firebase
//    หมายเหตุ: บังคับแค่ตอนมีสะพาน TaxiNative.googleSignIn — ถ้าลบ dependency นี้ ต้องลบโค้ดใน MainActivity ด้วย
dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
