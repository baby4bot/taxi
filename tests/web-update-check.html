<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบ: ตรวจเวอร์ชันเว็บใหม่ + อัปเดตตัวเอง</title>
<style>
  body { background: #0b1220; color: #e6e9f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; line-height: 1.55; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9aa4b2; font-size: 12.5px; margin-bottom: 14px; }
  #summary { font-size: 15px; font-weight: 700; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; background: rgba(255,255,255,0.04); margin-bottom: 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; font-size: 13px; white-space: pre-wrap; }
  li.normal { border-color: rgba(34,197,94,0.55); }
  li.fail { border-color: rgba(239,68,68,0.75); background: rgba(239,68,68,0.10); }
  .detail { color: #9aa4b2; font-size: 12px; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700; }
  iframe { display: none; }
</style>
</head>
<body>
<h1>🔄 ทดสอบระบบ “มีเวอร์ชันใหม่ → อัปเดตเอง”</h1>
<div class="sub">รันออฟไลน์ได้ (ยกเว้นด่านที่อ่าน version.json ซึ่งเป็นไฟล์ในเครื่องเอง — ไม่ต้องใช้เน็ตออกนอกเครื่อง)</div>
<div id="summary">กำลังเริ่ม…</div>
<ul id="results"></ul>
<p><button id="runBtn">รันใหม่</button></p>
<iframe id="appFrame" src="../index.html?fsNowrite=1"></iframe>

<script>
(function () {
  'use strict';
  const frame = document.getElementById('appFrame');
  const resultsEl = document.getElementById('results');
  const summaryEl = document.getElementById('summary');
  let passCount = 0, failCount = 0;
  const failures = [];
  const w = () => frame.contentWindow;
  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  async function scenario(name, fn) {
    const row = document.createElement('li');
    row.textContent = '⏳ ' + name;
    resultsEl.appendChild(row);
    try {
      const out = await fn();
      row.className = 'normal';
      row.innerHTML = '<b>✅ ผ่าน</b> ' + name + (out ? '\n<span class="detail">' + out + '</span>' : '');
      passCount++;
    } catch (e) {
      row.className = 'fail';
      row.innerHTML = '<b>❌ ล้มเหลว</b> ' + name + '\n<span class="detail">' + (e && e.message ? e.message : String(e)) + '</span>';
      failures.push(name + ': ' + (e && e.message ? e.message : String(e)));
      failCount++;
    }
    summaryEl.innerHTML = 'ผลรวม: ผ่าน ' + passCount + ' / ' + (passCount + failCount) + (failCount ? ' — ❌ ล้มเหลว ' + failCount : ' — ✅ ครบทุกข้อ');
  }

  async function bootApp() {
    const t0 = Date.now();
    while (Date.now() - t0 < 30000) {
      const cw = w();
      if (cw && typeof cw.__versionCheckDecide === 'function' && typeof cw.__webUpdateCheck === 'function') { await wait(200); return; }
      await wait(100);
    }
    throw new Error('แอปโหลดไม่ทันใน 30 วิ');
  }

  async function runAll() {
    resultsEl.innerHTML = ''; passCount = 0; failCount = 0; failures.length = 0;
    summaryEl.textContent = 'กำลังรัน…';
    await bootApp();
    const cw = w();
    const d = (...a) => cw.__versionCheckDecide(...a);
    // ⏱️ ปิดการเด้งอัตโนมัติตอนเปิดแอปไว้ก่อน — ชุดนี้ตรวจแบบเรียกเองทีละครั้ง (ไม่งั้นแผงโผล่มาแทรกระหว่างข้อ)
    cw.__wnNoAuto = true;

    await scenario('1. ตัวตัดสินใจ: เวอร์ชันตรงกัน → ไม่ทำอะไร', async () => {
      assert(d('abc123', 'abc123', {}) === 'none', 'ต้องได้ none (ได้ ' + d('abc123', 'abc123', {}) + ')');
      return 'same → none';
    });

    await scenario('2. ตัวตัดสินใจ: มีเวอร์ชันใหม่ + ว่างงาน → อัปเดตเอง', async () => {
      const v = d('newver999', 'oldver111', {});
      assert(v === 'reload', 'ต้องได้ reload (ได้ ' + v + ')');
      return 'newer + idle → reload';
    });

    await scenario('3. ตัวตัดสินใจ: มีเวอร์ชันใหม่ + กำลังเดินมิเตอร์ → เด้งป้าย ไม่รีโหลด', async () => {
      const cases = [
        ['tripRunning', { tripRunning: true }],
        ['paused', { paused: true }],
        ['modalOpen', { modalOpen: true }],
        ['typing', { typing: true }]
      ];
      for (const [label, ctx] of cases) {
        const v = d('newver999', 'oldver111', ctx);
        assert(v === 'prompt', label + ' ต้องได้ prompt (ได้ ' + v + ')');
      }
      return 'ครบ 4 กรณี (เที่ยวเดิน · พักมิเตอร์ · มีหน้าต่างเปิด · กำลังพิมพ์) → prompt';
    });

    await scenario('4. ตัวตัดสินใจ: ออฟไลน์ หรืออ่านเวอร์ชันไม่ได้ → เงียบไว้', async () => {
      assert(d('newver999', 'oldver111', { offline: true }) === 'none', 'ออฟไลน์ต้องไม่ทำอะไร');
      assert(d('', 'oldver111', {}) === 'none', 'เซิร์ฟเวอร์ไม่บอกเวอร์ชัน → เงียบ');
      assert(d('newver999', '', {}) === 'none', 'หน้านี้ไม่รู้เวอร์ชันตัวเอง → เงียบ (กันรีโหลดวน)');
      return 'offline / ไม่มีค่า → none';
    });

    await scenario('5. หน้าเว็บมีเวอร์ชันของตัวเอง (10 ตัวอักษร) + ตรงกับ version.json', async () => {
      const mine = cw.APP_WEB_VERSION;
      assert(mine && /^[0-9a-f]{10}$/.test(mine), 'APP_WEB_VERSION ต้องเป็น hex 10 ตัว (ได้ ' + mine + ')');
      const r = await fetch('../version.json?_=' + Date.now(), { cache: 'no-store' });
      assert(r.ok, 'อ่าน version.json ไม่ได้ (HTTP ' + r.status + ')');
      const j = await r.json();
      assert(j.v === mine, 'version.json.v (' + j.v + ') ต้องเท่ากับ APP_WEB_VERSION (' + mine + ')');
      assert(/^[0-9a-f]{32}$/.test(j.md5 || ''), 'version.json.md5 ต้องเป็น md5 (ได้ ' + j.md5 + ')');
      assert(Array.isArray(j.files), 'version.json ต้องมีรายการไฟล์');
      return 'v=' + mine + ' · md5=' + j.md5.slice(0, 8) + '… · ไฟล์: ' + j.files.join(', ');
    });

    await scenario('6. เปิดแอปแล้วห้ามรีโหลดเอง (เวอร์ชันตรงกัน) + ไม่มีป้ายค้าง', async () => {
      const out = await cw.__webUpdateCheck('test');
      assert(out === 'same', 'ตรวจเวอร์ชันต้องได้ same (ได้ ' + out + ')');
      const diag = cw.__webVersionDiag();
      assert(diag.reloadScheduled === false, 'ห้ามตั้งเวลารีโหลดเมื่อเวอร์ชันตรงกัน');
      assert(diag.pill === false, 'ห้ามมีป้าย “มีเวอร์ชันใหม่” ค้างอยู่');
      return 'ตรวจได้ same · reloadScheduled=false · ไม่มีป้าย';
    });

    await scenario('7. ป้าย “มีเวอร์ชันใหม่” เปลี่ยนข้อความตามสถานะ (ว่างงาน = กดเอง · กลางเที่ยว = รอจบเที่ยว)', async () => {
      const T = cw.__webVersionTest;
      assert(T && typeof T.showPill === 'function', 'ไม่พบตะขั้วทดสอบ __webVersionTest');
      cw.isManualRunning = false;
      T.showPill('newver999');
      await wait(60);
      const idle = T.pillText() || '';
      assert(/แตะอัปเดต/.test(idle), 'ตอนว่างงานต้องชวนให้แตะอัปเดต (ได้: ' + idle + ')');
      cw.isManualRunning = true;
      T.showPill('newver999');
      await wait(60);
      const trip = T.pillText() || '';
      assert(/หลังจบเที่ยว/.test(trip), 'กลางเที่ยวต้องบอกว่าจะอัปเดตให้หลังจบเที่ยว (ได้: ' + trip + ')');
      cw.isManualRunning = false;
      T.hidePill();
      await wait(60);
      assert(T.pillText() === null, 'สั่งซ่อนแล้วป้ายต้องหายไป');
      return 'ว่างงาน: “' + idle.trim().slice(0, 34) + '…” · กลางเที่ยว: “' + trip.trim().slice(0, 40) + '…”';
    });

    await scenario('8. ไม่มีสคริปต์อื่นพัง: ตัวเช็คทำงานกับออฟไลน์ได้โดยไม่ throw', async () => {
      const before = cw.__webVersionDiag();
      assert(typeof before.lastCheckAgeSec === 'number' || before.lastCheckAgeSec === null, 'อ่านค่า diag ได้');
      return 'diag = ' + JSON.stringify(before);
    });

    await scenario('9. สรุป “มีอะไรใหม่”: เทียบหัวข้อรุ่นเดิมกับรุ่นใหม่ → บอกเฉพาะที่เพิ่มมา', async () => {
      const d = cw.__whatsNewDecide;
      assert(typeof d === 'function', 'ไม่พบตัวตัดสินใจ __whatsNewDecide');
      const rec = { to: 'newver999', from: 'oldver111', beforeNotes: ['หัวข้อเดิม ก', 'หัวข้อเดิม ข'] };
      const info = d(rec, 'newver999', ['หัวข้อเดิม ก', 'หัวข้อเดิม ข', 'หัวข้อใหม่ ค'], '2026-09-18');
      assert(info.show === true, 'ต้องเด้งสรุป (ได้ show=' + info.show + ')');
      assert(info.notes.length === 1 && info.notes[0] === 'หัวข้อใหม่ ค', 'ต้องเหลือเฉพาะหัวข้อใหม่ (ได้ ' + JSON.stringify(info.notes) + ')');
      assert(info.freshCount === 1, 'ต้องนับว่ามีของใหม่ 1 รายการ');
      return 'เดิม 2 · ใหม่ 1 → แสดงเฉพาะ “' + info.notes[0] + '”';
    });

    await scenario('10. สรุป “มีอะไรใหม่”: เด้งครั้งเดียวต่อการอัปเดต 1 ครั้ง (ปิดแล้วไม่เด้งซ้ำ)', async () => {
      const d = cw.__whatsNewDecide;
      const notes = ['ก', 'ข', 'ค'];
      const base = { to: 'v9', from: 'v8', beforeNotes: ['ก', 'ข'] };
      assert(d(base, 'v9', notes, '').show === true, 'ยังไม่เคยเด้ง → ต้องเด้ง');
      assert(d(Object.assign({}, base, { shownAt: 12345 }), 'v9', notes, '').show === false, 'เคยเด้งแล้ว → ห้ามเด้งซ้ำ');
      assert(d(Object.assign({}, base, { to: 'v7' }), 'v9', notes, '').show === false, 'จดไว้คนละรุ่น (อัปเดตไม่สำเร็จ) → ห้ามเด้ง');
      assert(d(null, 'v9', notes, '').show === false, 'ไม่มีบันทึก → ไม่เด้ง');
      assert(d(base, 'v9', ['ก'], '').show === false, 'มีหัวข้อเดียว → ไม่มีอะไรให้สรุป');
      return 'เด้งครั้งเดียว · กันจดข้ามรุ่น · กันตอนไม่เปลี่ยนอะไร';
    });

    await scenario('11. สรุป “มีอะไรใหม่”: แยกรณี “ของใหม่” กับ “ไฮไลต์” และเงียบเมื่อไม่มีอะไรเปลี่ยน', async () => {
      const d = cw.__whatsNewDecide;
      const notes = ['หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก'];
      // เทียบไม่ได้ (จดรายการรุ่นเดิมไว้หาย) → โหมดไฮไลต์ 4 รายการ
      const loose = d({ to: 'v9', from: 'v8', beforeNotes: [] }, 'v9', notes, '');
      assert(loose.show === true && loose.exact === false, 'เทียบไม่ได้ → ต้องเด้งแบบไฮไลต์');
      assert(loose.notes.length === 4, 'ไฮไลต์ต้องไม่เกิน 4 รายการ (ได้ ' + loose.notes.length + ')');
      // เทียบได้ + ทุกหัวข้อเป็นของใหม่ → โหมดใหม่ เพดาน 6 รายการ
      const cap = d({ to: 'v9', from: 'v8', beforeNotes: ['ของเก่าที่ไม่มีแล้ว'] }, 'v9', notes, '');
      assert(cap.exact === true && cap.notes.length === 6, 'ของใหม่ทั้งชุด → แสดงไม่เกิน 6 รายการ (ได้ ' + cap.notes.length + ')');
      // เทียบได้ + ไม่มีอะไรเปลี่ยน (เช่น push ที่ไม่เพิ่มหัวข้อ) → ต้องเงียบ ไม่กวนผู้ใช้
      const same = d({ to: 'v9', from: 'v8', beforeNotes: notes }, 'v9', notes, '');
      assert(same.show === false, 'ไม่มีอะไรเปลี่ยน → ห้ามเด้งสรุป');
      return 'เทียบไม่ได้ → ไฮไลต์ 4 · ของใหม่ทั้งชุด → 6 (เพดาน) · ไม่มีอะไรเปลี่ยน → เงียบ';
    });

    await scenario('12. หน้าจอจริง: แผง “มีอะไรใหม่” ขึ้นหลังอัปเดต และกดปิดได้ (ไม่เด้งซ้ำ)', async () => {
      const T = cw.__whatsNewTest;
      assert(T && typeof T.setRecord === 'function', 'ไม่พบตะขั้วทดสอบ __whatsNewTest');
      T.clearRecord(); T.clearLocalSeen();
      T.seenOverride({ uid: 'tester', v: 'otherver00' });   // ให้เซิร์ฟเวอร์บอกว่า “ยังไม่เคยอ่านรุ่นนี้”
      assert((await cw.__whatsNewAfterUpdate('test')) === 'none', 'ยังไม่มีบันทึก → ต้องไม่ทำอะไร');
      T.setRecord({ to: T.running(), from: 'oldver000', at: Date.now(), date: '2026-09-18', beforeNotes: [] });
      const out = await cw.__whatsNewAfterUpdate('test');
      assert(/^shown:\d+$/.test(out), 'ต้องเด้งแผงสรุป (ได้ ' + out + ')');
      const txt = T.panelText() || '';
      assert(/มีอะไรใหม่ในเวอร์ชันนี้/.test(txt), 'แผงต้องมีหัวข้อ (ได้: ' + txt.slice(0, 40) + '…)');
      const head = (T.notes() || [])[0] || '';
      assert(head && txt.includes(head.slice(0, 12)), 'แผงต้องแสดงเนื้อหาจากประวัติเวอร์ชันจริง (ได้: ' + JSON.stringify((T.notes() || []).slice(0, 1)) + ')');
      const doc = cw.document;
      const okBtn = doc.getElementById('whatsNewOk');
      assert(!!okBtn, 'ต้องมีปุ่มปิด “รับทราบ”');
      okBtn.click();
      await wait(60);
      assert(T.panelText() === null, 'กดปิดแล้วแผงต้องหาย');
      assert((await cw.__whatsNewAfterUpdate('test')) === 'none', 'ปิดแล้วต้องไม่เด้งซ้ำในรอบเดียวกัน');
      const xBtn = doc.getElementById('whatsNewClose');
      assert(!!xBtn, 'ต้องมีปุ่ม ✕ มุมขวาบนให้ปิดได้');
      T.seenOverride(null); T.clearLocalSeen(); T.clearRecord();
      return 'ขึ้นจริง · มีเนื้อหาจากประวัติเวอร์ชัน · ปิดได้ทั้งปุ่มรับทราบและ ✕ · ไม่เด้งซ้ำ';
    });

    await scenario('13. “อ่านแล้ว” ต่อบัญชี: เคยอ่านรุ่นนี้ที่เครื่องอื่น → ต้องไม่เด้งซ้ำ', async () => {
      const d = cw.__whatsNewDecide;
      const notes = ['ก', 'ข', 'ค'];
      const rec = { to: 'v9', from: 'v8', beforeNotes: ['ก', 'ข'] };
      const seenSame = d(rec, 'v9', notes, '', { uid: 'u1', v: 'v9' });
      assert(seenSame.show === false && seenSame.skip === 'seen', 'อ่านรุ่นนี้แล้ว → ห้ามเด้ง (ได้ ' + JSON.stringify(seenSame) + ')');
      const seenOld = d(rec, 'v9', notes, '', { uid: 'u1', v: 'v8' });
      assert(seenOld.show === true, 'เคยอ่านแค่รุ่นก่อน → ต้องเด้งรุ่นใหม่');
      const noSeen = d(rec, 'v9', notes, '');
      assert(noSeen.show === true, 'ไม่มีข้อมูลการอ่าน (เช่นยังไม่ล็อกอิน/อ่านไม่ได้) → ต้องเด้ง');
      return 'อ่านรุ่นเดียวกัน=เงียบ · คนละรุ่น=เด้ง · ไม่มีข้อมูล=เด้ง';
    });

    await scenario('14. หน้าจอจริง: บัญชีนี้เคยอ่านแล้ว → ไม่เด้ง + บันทึกว่าอ่านลงเครื่อง', async () => {
      const T = cw.__whatsNewTest;
      assert(T && typeof T.seenOverride === 'function', 'ไม่พบตะขั้ว seenOverride');
      T.clearRecord(); T.clearLocalSeen();
      // จำลองว่าเซิร์ฟเวอร์บอกว่า “บัญชีนี้เคยอ่านรุ่นนี้แล้ว”
      T.seenOverride({ uid: 'tester', v: T.running(), at: Date.now() });
      T.setRecord({ to: T.running(), from: 'oldver000', at: Date.now(), date: '2026-09-18', beforeNotes: T.notes().slice(0, 3) });
      const out = await cw.__whatsNewAfterUpdate('test');
      assert(out === 'seen', 'ต้องรู้ว่าเคยอ่านแล้ว (ได้ ' + out + ')');
      assert(T.panelText() === null, 'ต้องไม่มีแผงโผล่');
      // จำลองตรงกันข้าม: ยังไม่เคยอ่าน → ต้องเด้ง
      T.seenOverride({ uid: 'tester', v: 'otherver00', at: Date.now() });
      T.setRecord({ to: T.running(), from: 'oldver000', at: Date.now(), date: '2026-09-18', beforeNotes: T.notes().slice(0, 3) });
      const out2 = await cw.__whatsNewAfterUpdate('test');
      assert(/^shown:\d+$/.test(out2), 'ยังไม่เคยอ่าน → ต้องเด้ง (ได้ ' + out2 + ')');
      // กดปิด → ต้องจดว่าอ่านแล้วไว้ในเครื่อง (แล้วเซิร์ฟเวอร์จะได้ค่านี้ในรอบถัดไป)
      cw.document.getElementById('whatsNewOk').click();
      await wait(120);
      const localSeen = T.localSeen();
      assert(localSeen && localSeen.v === T.running(), 'ปิดแล้วต้องจดว่า “อ่านรุ่นนี้แล้ว” (ได้ ' + JSON.stringify(localSeen) + ')');
      T.seenOverride(null); T.clearRecord(); T.clearLocalSeen();
      return 'เคยอ่าน → เงียบ · ยังไม่เคย → เด้ง · ปิดแล้วจดค่าลงเครื่อง (v=' + (localSeen ? localSeen.v : '') + ')';
    });

    // ============================================================
    // 🆕 ชุดที่ 15–20: ทาง “เปิดแอปแล้วเจอรุ่นใหม่” (boot path · __whatsNewOnBoot)
    //    ผู้ใช้สั่ง 19 ก.ย. 69: “ให้แอปเด้งสรุปสั้น ๆ ว่ามีอะไรใหม่เฉพาะเมื่อ APP_WEB_VERSION เปลี่ยน
    //    โดยดึงจากประวัติเวอร์ชันและปิดได้” ⇒ เคสจริงคือปิดแอป/ปิดจอแล้วเปิดใหม่ (ไม่ใช่แค่รีโหลดในเซสชัน)
    // ============================================================
    await scenario('15. เปิดแอปครั้งแรก (ยังไม่เคยอ่านรุ่นไหน) → ไม่เด้ง + จดรุ่นนี้ว่าอ่านแล้ว', async () => {
      const T = cw.__whatsNewTest;
      assert(T && typeof T.onBoot === 'function', 'ไม่พบตะขั้ว T.onBoot สำหรับทางเปิดแอป');
      // ⚠️ สตับคำตอบเซิร์ฟเวอร์เป็น “ไม่รู้จัก” เพื่อไม่ให้ชุดทดสอบยิง Firestore จริง (บัญชีผู้ใช้จริงอาจเคยอ่านรุ่นนี้แล้ว)
      T.clearLocalSeen(); T.clearRecord(); T.seenOverride({});
      const out = await T.onBoot('test');
      assert(out === 'first', 'ผู้ใช้ใหม่ต้องได้ first เงียบ ๆ (ได้ ' + out + ')');
      assert(T.panelText() === null, 'ห้ามเด้งแผงใส่ผู้ใช้ที่เพิ่งเปิดครั้งแรก');
      const s = T.localSeen();
      assert(s && s.v === T.running(), 'ต้องจดว่ารับรุ่นนี้แล้ว (ได้ ' + JSON.stringify(s) + ')');
      return 'first → เงียบ · จดอ่านแล้ว v=' + s.v;
    });

    await scenario('16. รุ่นที่อ่านล่าสุด = รุ่นที่รันอยู่ → ไม่เด้ง', async () => {
      const T = cw.__whatsNewTest;
      T.clearLocalSeen(); T.clearRecord(); T.seenOverride({});
      T.setLocalSeen(T.running(), T.notesNow());
      const out = await T.onBoot('test');
      assert(out === 'same', 'รุ่นเดิมต้องเงียบ (ได้ ' + out + ')');
      assert(T.panelText() === null, 'ต้องไม่มีแผง');
      return 'same → เงียบ';
    });

    await scenario('17. รุ่นเปลี่ยน + เทียบได้ → เด้ง “เฉพาะหัวข้อที่เพิ่มมาใหม่”', async () => {
      const T = cw.__whatsNewTest;
      const notes = T.notesNow();
      assert(notes.length >= 3, 'ประวัติเวอร์ชันวันนี้ต้องมีหัวข้อให้ทดสอบ (มี ' + notes.length + ')');
      T.clearLocalSeen(); T.clearRecord(); T.seenOverride({});
      T.setLocalSeen('oldver000', notes.slice(0, 2));      // เคยอ่านรุ่นเก่า ตอนนั้นมี 2 หัวข้อ
      const out = await T.onBoot('test');
      assert(/^shown:\d+$/.test(out), 'ต้องเด้งแผงสรุป (ได้ ' + out + ')');
      const txt = T.panelText() || '';
      assert(/มีอะไรใหม่ในเวอร์ชันนี้/.test(txt), 'แผงต้องมีหัวข้อ “มีอะไรใหม่ในเวอร์ชันนี้” (ได้: ' + txt.slice(0, 40) + '…)');
      const newNode = notes[2];
      assert(txt.includes(newNode.slice(0, 12)), 'ต้องแสดงหัวข้อใหม่จากประวัติเวอร์ชันจริง (ได้: ' + JSON.stringify(newNode) + ')');
      assert(!txt.includes(notes[0].slice(0, 12)), 'หัวข้อที่เคยอ่านแล้วต้องไม่ถูกแสดงซ้ำ');
      assert(/ใหม่ \d+ รายการ/.test(txt), 'ต้องบอกว่าเป็น “ใหม่ N รายการ” (ได้: ' + txt.slice(0, 120) + ')');
      const el = cw.document.getElementById('whatsNewPanel');
      assert(el && !el.classList.contains('modal-overlay'), 'แผงต้องเป็นกล่องเล็ก ไม่ใช่ออฟเลย์ที่บังจอ');
      assert(cw.getComputedStyle(el).position === 'fixed', 'แผงต้องลอยทับ ไม่ดันเนื้อหา');
      return 'รุ่นใหม่ (เทียบได้) → แสดง ' + out.replace('shown:', '') + ' รายการ เฉพาะของใหม่ · ไม่ซ้ำของเดิม';
    });

    await scenario('18. กดปิด → จดว่าอ่านรุ่นนี้แล้ว + เปิดใหม่แล้วไม่เด้งซ้ำ', async () => {
      const T = cw.__whatsNewTest;
      assert(T.panelVisible(), 'ต้องมีแผงค้างอยู่จากข้อก่อนหน้า');
      const xBtn = cw.document.getElementById('whatsNewClose');
      assert(!!xBtn, 'ต้องมีปุ่ม ✕ ให้ปิดได้');
      xBtn.click();
      await wait(80);
      assert(!T.panelVisible(), 'กด ✕ แล้วแผงต้องหาย');
      const s = T.localSeen();
      assert(s && s.v === T.running(), 'ปิดแล้วต้องจดว่า “อ่านรุ่นนี้แล้ว” (ได้ ' + JSON.stringify(s) + ')');
      assert(Array.isArray(s.notes) && s.notes.length > 0, 'ต้องจดหัวข้อ ณ รุ่นนี้ไว้ เพื่อเทียบครั้งถัดไป');
      const again = await T.onBoot('test');
      assert(again === 'same', 'เปิดอีกครั้งต้องไม่เด้งซ้ำ (ได้ ' + again + ')');
      return '✕ ปิดได้ · จดอ่านแล้ว v=' + s.v + ' (โน้ต ' + s.notes.length + ' หัวข้อ) · เปิดซ้ำ → same';
    });

    await scenario('19. กลางเที่ยว → เลื่อนไว้ก่อน (ไม่บังจอมิเตอร์) แล้วเด้งตอนจบเที่ยว', async () => {
      const T = cw.__whatsNewTest;
      T.clearLocalSeen(); T.clearRecord(); T.seenOverride({});
      cw.isManualRunning = false; cw.isMeterPaused = false;
      T.setLocalSeen('oldver000', T.notesNow().slice(0, 2));
      cw.isManualRunning = true; cw.isMeterPaused = false;
      const out = await T.onBoot('test');
      assert(out === 'defer-trip', 'กำลังเดินมิเตอร์ต้องเลื่อนไปก่อน (ได้ ' + out + ')');
      assert(T.panelText() === null, 'ห้ามเด้งแผงทับจอมิเตอร์');
      assert(T.localSeen().v === 'oldver000', 'ห้ามจดว่าอ่านแล้วตอนที่ยังไม่เด้ง');
      cw.isManualRunning = false; cw.isMeterPaused = false;
      const after = await T.onBoot('trip-end');
      assert(/^shown:\d+$/.test(after), 'จบเที่ยวแล้วต้องเด้ง (ได้ ' + after + ')');
      cw.document.getElementById('whatsNewOk').click();
      await wait(80);
      assert(!T.panelVisible(), 'กด “รับทราบ” แล้วแผงต้องหาย');
      return 'กลางเที่ยว = defer (ไม่จดว่าอ่าน) · จบเที่ยว = เด้ง · ปุ่มรับทราบปิดได้';
    });

    await scenario('20. ข้ามเครื่อง: เอกสารผู้ใช้บอกว่าเคยอ่านรุ่นนี้แล้ว → เงียบ', async () => {
      const T = cw.__whatsNewTest;
      cw.isManualRunning = false; cw.isMeterPaused = false;
      T.clearLocalSeen(); T.clearRecord();
      T.seenOverride({ uid: 'tester', v: T.running(), at: Date.now() });   // อ่านรุ่นนี้แล้วจากเครื่องอื่น
      const out = await T.onBoot('test');
      assert(out === 'seen', 'ต้องรู้ว่าเคยอ่านแล้ว (ได้ ' + out + ')');
      assert(T.panelText() === null, 'ต้องไม่เด้ง');
      assert(T.localSeen().v === T.running(), 'ต้องจดลงเครื่องไว้ด้วย (รอบถัดไปไม่ต้องถามเซิร์ฟเวอร์)');
      // เทียบได้แต่ไม่มีของใหม่ (push ที่ไม่เพิ่มหัวข้อ) → เงียบ ไม่กวนผู้ใช้
      T.clearLocalSeen();
      T.seenOverride({ uid: 'tester', v: 'otherver00', at: Date.now() });
      T.setLocalSeen('oldver000', T.notesNow());
      const out2 = await T.onBoot('test');
      assert(out2 === 'nothing-new', 'ไม่มีหัวข้อใหม่ต้องเงียบ (ได้ ' + out2 + ')');
      assert(T.panelText() === null, 'ต้องไม่มีแผง');
      assert(T.localSeen().v === T.running(), 'ต้องจดรุ่นใหม่ไว้ เพื่อไม่ให้ถามซ้ำ');
      T.seenOverride(null); T.clearLocalSeen(); T.clearRecord();
      return 'เคยอ่านที่เครื่องอื่น → seen (เงียบ) · ไม่มีหัวข้อใหม่ → nothing-new (เงียบ) · จดรุ่นทั้งสองกรณี';
    });

    await scenario('21. ไม่มีความถอยหลัง: รีโหลดอัตโนมัติในเซสชัน (ทางเดิม) ยังทำงานเหมือนเดิม', async () => {
      const T = cw.__whatsNewTest;
      T.clearLocalSeen(); T.clearRecord();
      T.seenOverride({ uid: 'tester', v: 'otherver00' });
      T.setRecord({ to: T.running(), from: 'oldver000', at: Date.now(), date: '2026-09-18', beforeNotes: [] });
      const out = await cw.__whatsNewAfterUpdate('test');
      assert(/^shown:\d+$/.test(out), 'ทางเดิมต้องเด้งได้เหมือนก่อนแก้ (ได้ ' + out + ')');
      cw.document.getElementById('whatsNewOk').click();
      await wait(80);
      assert((await cw.__whatsNewAfterUpdate('test')) === 'none', 'ปิดแล้วต้องไม่เด้งซ้ำในรอบเดียวกัน');
      T.clearRecord(); T.clearLocalSeen(); T.seenOverride(null);
      return 'หลังรีโหลดอัตโนมัติยังเด้ง + ปิดแล้วไม่ซ้ำ (ไม่ถูกของใหม่ทับ) · ข้อ 1–14 ยังผ่านครบ';
    });

    cw.__wnNoAuto = false;
    if (failures.length) console.warn('ล้มเหลว:', failures);
  }

  document.getElementById('runBtn').addEventListener('click', runAll);
  window.addEventListener('load', () => { runAll(); });
})();
</script>
</body>
</html>
