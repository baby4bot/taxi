<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ใบเสร็จค่าโดยสาร</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
        background: linear-gradient(180deg, #141a26 0%, #0d1119 100%);
        font-family: Tahoma, "Segoe UI", "Noto Sans Thai", sans-serif;
        display: flex; flex-direction: column; align-items: center; padding: 18px 10px 30px; min-height: 100vh;
    }
    h1 { color: #fff; font-size: 19px; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.4px; }
    .sub { color: #8fa0ba; font-size: 12.5px; margin-bottom: 14px; }
    .paper-wrap { background: #fff; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.55); padding: 14px; max-width: 480px; width: 100%; }
    canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #fff; }
    .actions { margin-top: 16px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
        width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700;
        cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg, #2ecc71, #0f8a4a); color: #fff; box-shadow: 0 8px 22px rgba(46,204,113,.3); }
    .btn-ghost { background: rgba(255,255,255,.07); color: #cfe0ff; border: 1px solid rgba(255,255,255,.15); }
    .hint { color: #7c88a2; font-size: 11.5px; text-align: center; margin-top: 12px; line-height: 1.6; max-width: 440px; }
    #err { color: #ffb4b4; background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.35); border-radius: 12px; padding: 16px; font-size: 14px; text-align: center; max-width: 480px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
    <h1>ใบเสร็จค่าโดยสาร</h1>
    <div class="sub">Taxi Meter • ใบเสร็จรูปภาพสำหรับผู้โดยสาร</div>
    <div class="paper-wrap">
        <canvas id="rc"></canvas>
    </div>
    <div class="actions">
        <button class="btn btn-primary" id="dlBtn"><span>⬇️</span> ดาวน์โหลดรูปใบเสร็จ (PNG)</button>
        <button class="btn btn-ghost" id="shareBtn" style="display:none;"><span>📤</span> แชร์ใบเสร็จ</button>
    </div>
    <div class="hint">ไฟล์รูปใบเสร็จจะถูกบันทึกไว้ในเครื่องของคุณทันที<br>ถ้าบันทึกไม่ได้ (iPhone) ให้กดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"</div>
    <div id="err" style="display:none;"></div>
    <div class="toast" id="toast"></div>

<script>
(function () {
    const cv = document.getElementById('rc');
    const ctx = cv.getContext('2d');
    const dlBtn = document.getElementById('dlBtn');
    const shareBtn = document.getElementById('shareBtn');
    const errBox = document.getElementById('err');
    const toastEl = document.getElementById('toast');
    const showErr = (msg) => { errBox.style.display = 'block'; errBox.textContent = msg; document.querySelector('.paper-wrap').style.display = 'none'; };
    const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2600); };

    // ---------- ถอดรหัสข้อมูลจาก URL (?d= base64url ของ JSON) ----------
    let d = null;
    try {
        const raw = new URLSearchParams(location.search).get('d') || (location.hash.startsWith('#d=') ? location.hash.slice(3) : '');
        if (!raw) throw new Error('no data');
        const b64 = raw.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (raw.length % 4)) % 4);
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const json = new TextDecoder('utf-8').decode(bytes);
        d = JSON.parse(json);
        if (!d || !d.st) throw new Error('bad payload');
    } catch (e) {
        showErr('ไม่พบข้อมูลใบเสร็จ หรือลิงก์ไม่ถูกต้อง / หมดอายุแล้ว\nกรุณาให้คนขับกดปุ่ม QR ใบเสร็จใหม่');
        return;
    }

    const pad2 = (n) => String(n).padStart(2, '0');
    const fmtDate = (ms) => { const x = new Date(ms); return x.toLocaleDateString('th-TH', { day: '2-digit', month: 'long', year: 'numeric' }); };
    const fmtTime = (ms) => { const x = new Date(ms); return pad2(x.getHours()) + ':' + pad2(x.getMinutes()); };
    const dur = (sec) => {
        sec = Math.max(0, Math.round(sec));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        if (h > 0) return h + ' ชม. ' + m + ' นาที';
        if (m > 0) return s > 0 ? m + ' นาที ' + s + ' วิ' : m + ' นาที';
        return s + ' วิ';
    };
    const money = (n) => Math.round(n).toLocaleString('th-TH');
    const receiptNo = 'TX-' + Math.floor(d.st / 1000).toString(36).toUpperCase().slice(-6);
    const wall = Math.round((d.et - d.st) / 1000);

    // ---------- วาดใบเสร็จแบบกระดาษขาว ----------
    const W = 700, SCALE = 2;
    cv.width = W * SCALE; cv.height = 1010 * SCALE;
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = 'middle';
    ctx.font = '500 13px Tahoma, "Noto Sans Thai", sans-serif';

    // พื้นกระดาษ
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, 1010);

    const cx = W / 2;
    const L = 40, R = W - 40;
    const dash = (y, color) => { ctx.strokeStyle = color; ctx.setLineDash([5, 5]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); ctx.setLineDash([]); };

    // หัวกระดาษ
    ctx.fillStyle = '#0f8a4a';
    ctx.fillRect(0, 0, W, 118);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 26px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ใบเสร็จค่าโดยสาร', cx, 44);
    ctx.font = '600 12px Tahoma, sans-serif';
    ctx.fillText('TAXI FARE RECEIPT  •  TAXI METER', cx, 78);
    ctx.font = '500 12px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.fillText('ออกโดยคนขับแท็กซี่  •  ใบเสร็จรูปภาพ', cx, 100);

    ctx.textAlign = 'left';
    let y = 142;

    const pair = (label, value) => {
        ctx.fillStyle = '#555';
        ctx.font = '500 14px Tahoma, "Noto Sans Thai", sans-serif';
        ctx.fillText(label, L, y);
        const wl = ctx.measureText(label).width;
        ctx.fillStyle = '#111';
        ctx.font = '600 14px Tahoma, "Noto Sans Thai", sans-serif';
        ctx.fillText(value, L + wl + 8, y);
        y += 26;
    };
    const line = (label, value, strong) => {
        ctx.fillStyle = strong ? '#111' : '#444';
        ctx.font = (strong ? '700 ' : '500 ') + (strong ? 16 : 14) + 'px Tahoma, "Noto Sans Thai", sans-serif';
        ctx.fillText(label, L, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = strong ? '#0b7a3b' : '#111';
        ctx.font = (strong ? '800 ' : '700 ') + (strong ? 18 : 15) + 'px Tahoma, "Noto Sans Thai", sans-serif';
        ctx.fillText(money(value) + ' ฿', R, y);
        ctx.textAlign = 'left';
        y += strong ? 36 : 27;
    };
    const subNote = (txt) => { ctx.fillStyle = '#888'; ctx.font = '500 12px Tahoma, "Noto Sans Thai", sans-serif'; ctx.fillText(txt, L, y); y += 22; };

    pair('เลขที่ใบเสร็จ', receiptNo);
    pair('วันที่', fmtDate(d.st));
    pair('เวลาเริ่ม', fmtTime(d.st) + ' น.');
    pair('เวลาสิ้นสุด', fmtTime(d.et) + ' น.');
    if (d.drv) pair('คนขับ', d.drv);
    if (d.dn) {
        ctx.fillStyle = '#555'; ctx.font = '500 14px Tahoma, "Noto Sans Thai", sans-serif';
        ctx.fillText('จุดหมาย', L, y);
        y += 22;
        ctx.fillStyle = '#111'; ctx.font = '600 14px Tahoma, "Noto Sans Thai", sans-serif';
        const maxW = R - L;
        let t = d.dn;
        while (ctx.measureText(t).width > maxW && t.length > 1) { ctx.fillText(t.slice(0, Math.max(1, t.length - 1)), L, y); t = t.slice(Math.max(1, t.length - 1)); }
        if (t) ctx.fillText(t, L, y);
        y += 26;
    }
    y += 6;
    dash(y, '#bbb'); y += 26;

    line('ระยะทาง', d.km, false);
    subNote(d.km.toFixed(2) + ' กิโลเมตร  •  เวลารถติด ' + dur(d.tr) + '  •  รวมเวลา ' + dur(wall));
    y += 4;

    // รายละเอียดค่าโดยสาร
    dash(y, '#bbb'); y += 26;
    line('ค่าแรกเข้า', d.bf, false);
    line('ค่าระยะทาง + เวลารถติด', d.mt, false);
    (d.su || []).forEach(s => {
        line(s.n || 'ค่าเพิ่ม', s.a, false);
    });
    y += 4;
    dash(y, '#bbb'); y += 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0b7a3b'; ctx.font = '800 15px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.fillText('รวมค่าโดยสาร', cx, y);
    y += 34;
    ctx.fillStyle = '#0b7a3b'; ctx.font = '800 38px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.fillText(money(d.tot) + ' บาท', cx, y);
    ctx.textAlign = 'left';
    y += 44;
    dash(y, '#0b7a3b'); y += 36;

    ctx.textAlign = 'center';
    ctx.fillStyle = '#333'; ctx.font = '700 15px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.fillText('ขอบคุณที่ใช้บริการ  •  ขับขี่ปลอดภัย', cx, y); y += 26;
    ctx.fillStyle = '#888'; ctx.font = '500 12px Tahoma, "Noto Sans Thai", sans-serif';
    ctx.fillText('เอกสารนี้ออกโดยระบบ Taxi Meter • จ่ายเงินให้คนขับโดยตรง', cx, y); y += 22;
    ctx.fillText('พิมพ์เมื่อ ' + fmtDate(Date.now()) + ' ' + fmtTime(Date.now()) + ' น.', cx, y);
    ctx.textAlign = 'left';

    // ---------- ดาวน์โหลดรูป (1 แตะ) ----------
    const download = () => {
        try {
            const a = document.createElement('a');
            a.download = 'receipt-' + receiptNo + '.png';
            a.href = cv.toDataURL('image/png');
            document.body.appendChild(a); a.click(); a.remove();
            toast('กำลังดาวน์โหลดรูปใบเสร็จ…');
        } catch (e) { toast('ดาวน์โหลดไม่ได้ กดค้างที่รูปเพื่อบันทึก'); }
    };
    dlBtn.addEventListener('click', download);

    // ---------- แชร์ (มือถือ) ----------
    if (navigator.canShare && navigator.share) {
        shareBtn.style.display = 'flex';
        shareBtn.addEventListener('click', async () => {
            try {
                const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
                const file = new File([blob], 'receipt-' + receiptNo + '.png', { type: 'image/png' });
                if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'ใบเสร็จค่าโดยสาร' });
                else download();
            } catch (e) { if (e && e.name !== 'AbortError') download(); }
        });
    }
})();
</script>
</body>
</html>
