# ============================================================================
# สร้างไฟล์ APK ของแอป “ค่าแท็กซี่” บน GitHub (ไม่ต้องติดตั้งอะไรในเครื่อง)
#
# วิธีใช้
#   1) อัปโปรเจกต์ขึ้น GitHub แล้วเข้าแท็บ Actions → "Build Android APK" → Run workflow
#   2) รอ ~5-8 นาที → ดาวน์โหลด APK ได้ 2 ทาง
#        · Release ชื่อ "apk-latest"  (อยู่ถาวร ลิงก์เดียวใช้ตลอด)
#        · Artifact ชื่อ "taxi-meter-apk" (เก็บชั่วคราว)
#   3) ครั้งแรกเท่านั้น: งานจะสร้าง "กุญแจเซ็นแอป" ให้ → ดาวน์โหลด artifact
#      "keystore-bootstrap" แล้วเอาไปตั้งเป็น Secrets 2 ตัว (ดู android-app/README.md)
#      ⇒ ทำครั้งเดียว แล้วทุกบิลด์ต่อไปจะใช้ลายเซ็นเดิม = ติดตั้งทับของเดิมได้ ไม่ต้องถอนก่อน
#
# ⚠️ แก้ index.html (เว็บ) ไม่ต้องรันงานนี้ — ตัวแอปโหลดเว็บสด ๆ อยู่แล้ว
#    รันงานนี้เฉพาะเมื่อแก้ "ชั้น Android" ในโฟลเดอร์ android-app
# ============================================================================
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'หมายเหตุของบิลด์นี้ (ไม่บังคับ)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⛔ ไม่ใช้ android-actions/setup-android อีกแล้ว — รอบ 18 ก.ย. 2026 งานล้มที่ขั้นนี้
      #    เพราะตัวรัน GitHub เปลี่ยนไปใช้ Android Command Line Tools 12.0 (action รุ่นเก่าเข้ากับไม่ได้)
      #    ตัวรันมี Android SDK มาให้แล้ว: ANDROID_HOME=/usr/local/lib/android/sdk
      #      · platforms: android-34 (rev 3)  · build-tools: 34.0.0
      #    ⇒ ใช้ของที่มีอยู่เลย ไม่ต้องติดตั้งอะไร และไม่ต้องกดยอมรับสัญญาอนุญาต
      # sdk: preinstalled runner SDK (no setup-android)
      - name: ตรวจ Android SDK ที่มีในเครื่องรัน
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK = $SDK"
          echo "platforms:   $(ls -1 "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls -1 "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "java:        $(java -version 2>&1 | head -1)"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "::error::ไม่พบ platforms;android-34 — แก้ compileSdk ใน android-app/app/build.gradle ให้ตรงกับที่มีบนตัวรัน"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # ⛔ กับดักที่เคยทำ build ล้ม 3 รอบ (18 ก.ย. 2026): ไม่ประกาศที่เก็บไลบรารีใน settings.gradle
      #    ⇒ Gradle หา aapt2 ไม่เจอ แล้วล้มด้วยข้อความ “no repositories are defined” ที่หาสาเหตุยาก
      - name: ตรวจการตั้งค่าโปรเจกต์ (กันกับดักที่เคยทำให้ล้ม)
        working-directory: android-app
        run: |
          set -e
          if ! grep -q "dependencyResolutionManagement" settings.gradle; then
            echo "::error::settings.gradle ไม่มี dependencyResolutionManagement { repositories { google() mavenCentral() } } — build จะล้มเพราะหา aapt2 ไม่เจอ"
            exit 1
          fi
          grep -q "google()" settings.gradle || { echo "::error::settings.gradle ไม่มี google()"; exit 1; }
          grep -q "mavenCentral()" settings.gradle || { echo "::error::settings.gradle ไม่มี mavenCentral()"; exit 1; }
          # ⛔ กับดักที่ทำ build ล้ม (18 ก.ย. 2026): play-services-auth ลากไลบรารี androidx เข้ามาด้วย
          #    ถ้า gradle.properties ตั้ง android.useAndroidX=false → mergeReleaseNativeLibs ล้มทันที
          if grep -q "play-services-auth" app/build.gradle; then
            grep -q "^android.useAndroidX=true" gradle.properties \
              || { echo "::error::gradle.properties ต้องมี android.useAndroidX=true เพราะ play-services-auth (ล็อกอิน Google ในแอป) ดึงไลบรารี androidx มา"; exit 1; }
            echo "androidx เปิดให้แล้วเพราะมี play-services-auth ✅"
          fi
          echo "การตั้งค่าโปรเจกต์ครบ ✅"
          grep -n "compileSdk\|applicationId\|buildConfigField\|minSdk\|targetSdk" app/build.gradle

      - name: ติดตั้ง Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: สร้างกุญแจเซ็นแอป (ถ้าจำเป็น) แล้ว build APK
        working-directory: android-app
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          mkdir -p keys
          mkdir -p ../.build-logs
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > keys/keystore.jks
            PASS="$KS_PASS"
            printf '%s' 'secrets' > keys/KEY-MODE.txt
            echo "กุญแจเซ็นแอป: ใช้ไฟล์จาก Secret (ลายเซ็นถาวร ✅)"
          else
            PASS="$(openssl rand -hex 10)"
            keytool -genkeypair -v -keystore keys/keystore.jks -alias taxi \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Taxi Meter 2026, O=baby4bot, C=TH"
            printf '%s' "$PASS" > keys/keystore-password.txt
            base64 -w0 keys/keystore.jks > keys/keystore.jks.base64
            printf '%s' 'temporary' > keys/KEY-MODE.txt
            echo "::warning::ยังไม่ได้ตั้ง Secrets ⇒ รอบนี้สร้างกุญแจใหม่ — APK นี้ “อัปเดตทับของเดิมไม่ได้”"
          fi
          export TAXI_KEYSTORE=keys/keystore.jks
          export TAXI_STORE_PASSWORD="$PASS"
          export TAXI_KEY_ALIAS=taxi
          export TAXI_KEY_PASSWORD="$PASS"

          # สร้าง Gradle wrapper ไว้ให้ build ในเครื่องได้ด้วย (ไม่ใช้ตัวนี้ build บน CI)
          gradle wrapper --gradle-version 8.7 --no-daemon 2>&1 | tail -3
          chmod +x gradlew 2>/dev/null || true

          # build ด้วย Gradle 8.7 ที่ติดตั้งไว้แล้วโดยตรง — เลี่ยงการ bootstrap ของ wrapper
          #   (ทั้งขั้นตอนนี้เขียนบันทึกไว้ที่ .build-logs/apk-build.txt เพื่อส่งขึ้นกิ่ง ci-logs ถ้าล้ม)
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../.build-logs/apk-build.txt

      # 🔎 เผยบันทึกการสร้างเมื่อล้ม — เพราะ log ของ Actions ต้องล็อกอินอ่าน
      #    กิ่ง ci-logs อ่านได้สาธารณะ: https://raw.githubusercontent.com/baby4bot/taxi/ci-logs/.build-logs/tail.txt
      - name: ส่งบันทึกการสร้างขึ้นกิ่ง ci-logs (เฉพาะเมื่อล้ม)
        if: failure()
        run: |
          set -e
          mkdir -p .build-logs
          if [ -f .build-logs/apk-build.txt ]; then
            tail -250 .build-logs/apk-build.txt > .build-logs/tail.txt
          else
            echo "(ไม่มีบันทึก — งานล้มก่อนถึงขั้น build) run=$GITHUB_RUN_ID step ดูที่หน้า Actions" > .build-logs/tail.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-logs
          git add -f .build-logs/tail.txt
          git commit -m "ci log: run $GITHUB_RUN_ID"
          git push -f origin ci-logs

      # ⚠️ กับดักที่เคยพลาด (18 ก.ย. 2026): ได้ไฟล์ app-release-**unsigned**.apk แล้วทุกอย่าง “success”
      #    แต่เอาไปติดตั้งบนมือถือไม่ได้เลย (ระบบจะบอกแค่ว่าติดตั้งไม่ได้)
      - name: ตรวจว่า APK ถูกเซ็นจริง (ไม่งั้นติดตั้งบนมือถือไม่ได้)
        run: |
          set -e
          cd android-app/app/build/outputs/apk/release
          ls -l
          APK=$(ls -1 *.apk | head -1)
          case "$APK" in
            *unsigned*)
              echo "::error::ไฟล์ APK ยังไม่ถูกเซ็น ($APK) — เครื่อง Android จะติดตั้งไม่ได้ ตรวจเส้นทาง keystore ใน android-app/app/build.gradle (TAXI_KEYSTORE)"
              exit 1
              ;;
          esac
          # ⚠️ minSdk 26 ⇒ AGP เซ็นด้วยรูปแบบใหม่ (v2/v3) ซึ่ง “ไม่มี” META-INF/*.RSA
          #    จึงห้ามตัดสินด้วยการหาไฟล์ .RSA — ต้องใช้ apksigner ของจริง (มีมาใน build-tools)
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -5
            echo "APK ถูกเซ็นแล้ว (apksigner ยืนยัน) ✅ $APK — $(stat -c%s "$APK") ไบต์"
          else
            echo "::warning::ไม่พบ apksigner — ตรวจอย่างละเอียดไม่ได้"
            grep -aq "APK Sig Block 42" "$APK" || unzip -l "$APK" | grep -Eq 'META-INF/.*\.(RSA|EC|DSA)' || {
              echo "::error::ไม่พบลายเซ็นใน APK ($APK)"
              exit 1
            }
            echo "APK ดูเหมือนถูกเซ็นแล้ว ✅ $APK"
          fi

      # 🔎 พิสูจน์จาก “ในไฟล์ APK” เอง (ไม่ต้องติดตั้งบนมือถือ) ว่าชื่อแอป + ไอคอนคือชุดที่ตั้งใจ
      #    แล้วเขียน `apk-info.txt` แนบไปกับ Release — ใครก็โหลดอ่านได้ว่าไฟล์นี้คือแอปรุ่นไหน
      #    ⚠️ ขั้นนี้ “ไม่ทำให้งานล้ม” โดยเจตนา: ถ้า aapt2 อ่านไม่ครบ ยังต้องได้ APK ไปติดตั้ง (แค่เตือน)
      - name: ตรวจชื่อแอป + ไอคอนใน APK แล้วเขียนไฟล์ข้อมูล
        run: |
          set -e
          cd android-app/app/build/outputs/apk/release
          APK=$(ls -1 *.apk | head -1)
          BUILD_TOOLS="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          INFO=apk-info.txt
          {
            echo "ไฟล์: $APK"
            echo "ขนาด: $(stat -c%s "$APK") ไบต์"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "สร้างเมื่อ: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "รุ่นข้อมูล: run $GITHUB_RUN_ID"
            echo ""
          } > "$INFO"

          if [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" > badging.txt 2>/dev/null || true
            grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)" badging.txt >> "$INFO" || true
            echo "" >> "$INFO"

            # ⚠️ กับดักจริง 18 ก.ย. 2026: ห้ามตรวจไอคอนด้วยการดูลายชื่อไฟล์ในซิป (`unzip -l | grep ic_launcher`)
            #    AAPT2 ตั้งชื่อไฟล์ทรัพยากรเป็นชื่อสั้น (res/xx.png) ⇒ จะขึ้น “(ไม่พบรายการไอคอน)” ทุกครั้งทั้งที่ไอคอนอยู่ครบ
            #    ต้องอ่านจาก “ตารางทรัพยากร” ที่ aapt2 แปลออกมาเท่านั้น (application-icon-160:'res/…')
            echo "--- ไอคอนที่ฝังอยู่ใน APK (อ่านจากตารางทรัพยากร) ---" >> "$INFO"
            ICONS=$(grep -c -E "^application-icon" badging.txt || true)
            grep -E "^application-icon" badging.txt >> "$INFO" || true
            echo "จำนวนขนาดไอคอน: $ICONS" >> "$INFO"
            if [ "$ICONS" -lt 1 ]; then
              echo "::warning::ไม่พบไอคอนในตารางทรัพยากรของ APK — ตรวจ android:icon ใน AndroidManifest.xml"
            fi
            echo "" >> "$INFO"

            echo "--- ตรวจชื่อที่โชว์บนมือถือ ---" >> "$INFO"
            if grep -q "application-label:'ค่าแท็กซี่'" badging.txt; then
              echo "ชื่อแอปถูกต้อง: ค่าแท็กซี่ ✅" >> "$INFO"
            elif grep -q "application-label" badging.txt; then
              echo "::warning::ชื่อแอปใน APK ไม่ตรงกับที่คาด (ต้องเป็น ค่าแท็กซี่) — ดูบรรทัด application-label ใน apk-info.txt"
              grep "application-label" badging.txt >> "$INFO" || true
            else
              echo "::warning::aapt2 อ่านฉลากแอปไม่ได้ — ตรวจด้วยตาจาก apk-info.txt"
            fi
          else
            echo "::warning::ไม่พบ aapt2 ที่ $AAPT2 — ข้ามการตรวจชื่อแอป/ไอคอน"
          fi

          # 🔑 ลายเซ็นที่ใช้เซ็น APK นี้ — ไว้เทียบว่ายังเป็นกุญแจเดิมหรือเปลี่ยนไปแล้ว
          #    (คนขับเห็นข้อนี้ได้จากหน้า Release ⇒ รู้ก่อนติดตั้งว่าจะ “ทับของเดิมได้” หรือต้องถอนก่อน)
          echo "" >> "$INFO"
          echo "--- กุญแจที่ใช้เซ็น APK นี้ ---" >> "$INFO"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > certs.txt 2>/dev/null || true
            grep -E "Signer #1 certificate (DN|SHA-256 digest)" certs.txt | head -2 >> "$INFO" || true
          fi

          # 🔒 ด่านตรวจ “กุญแจถูกดอก” — เทียบลายนิ้วมือของ APK กับค่าที่ตั้งใจไว้ใน repo
          #    (ลายนิ้วมือเป็นข้อมูลสาธารณะ เก็บในไฟล์ได้ — ไม่ใช่ตัวกุญแจ)
          #    ถ้าไม่ตรง ⇒ APK นี้ “ติดตั้งทับแอปที่ผู้ใช้มีอยู่ไม่ได้” ⇒ หยุดทันที ไม่ให้หลุดไปให้คนโหลด
          #    ⚠️ กับดักจริง 18 ก.ย. 2026: ก่อนหน้านี้ทุกงานสร้างกุญแจใหม่เอง ลายนิ้วมือจึงเปลี่ยนทุกงาน
          #       ⇒ ต้องตรวจอัตโนมัติ ไม่งั้นได้ APK ที่ติดตั้งทับไม่ได้โดยไม่มีใครรู้
          EXPECT_FILE="$GITHUB_WORKSPACE/android-app/signing-key-fingerprint.txt"
          if [ -x "$APKSIGNER" ] && [ -f "$EXPECT_FILE" ]; then
            EXPECT=$(tr -d ':\r\n ' < "$EXPECT_FILE" | tr 'A-F' 'a-f')
            GOT=$(grep -E "Signer #1 certificate SHA-256 digest" certs.txt | head -1 | awk '{print $NF}' | tr -d ':\r\n' | tr 'A-F' 'a-f')
            if [ -n "$EXPECT" ] && [ -n "$GOT" ]; then
              if [ "$EXPECT" = "$GOT" ]; then
                echo "กุญแจตรงกับที่ตั้งใจ (${GOT:0:16}…) ✅ ติดตั้งทับแอปที่ผู้ใช้มีอยู่ได้" >> "$INFO"
              else
                echo "::error::กุญแจเซ็นไม่ตรงกับที่ตั้งใจ — APK นี้ติดตั้งทับของเดิมไม่ได้ (คาด ${EXPECT:0:16}… แต่ได้ ${GOT:0:16}…)"
                echo "::error::⇒ ถ้ายังไม่ได้ตั้ง Secrets: Repo → Settings → Secrets and variables → Actions → ตั้ง KEYSTORE_BASE64 (ข้อความใน .freebuff/signing-key/secret-KEYSTORE_BASE64.txt) + KEYSTORE_PASSWORD (ใน secret-KEYSTORE_PASSWORD.txt) แล้วกด Re-run งานนี้"
                echo "::error::⇒ ถ้าตั้งแล้ว: ค่าที่วางอาจขาด/เกิน ⇒ ลบ Secret แล้วตั้งใหม่ทั้ง 2 ตัวให้ครบ"
                exit 1
              fi
            fi
          fi
          MODE_FILE="$GITHUB_WORKSPACE/android-app/keys/KEY-MODE.txt"
          if [ -f "$MODE_FILE" ] && grep -q '^secrets' "$MODE_FILE"; then
            echo "โหมดกุญแจ: ถาวร (มาจาก Secrets) — ติดตั้งทับของเดิมได้ ✅" >> "$INFO"
          else
            echo "โหมดกุญแจ: ชั่วคราว (สร้างใหม่ทุกบิลด์) ⛔ ติดตั้งทับของเดิม “ไม่ได้” — ตั้ง Secrets ก่อน" >> "$INFO"
            echo "::warning::APK นี้เซ็นด้วยกุญแจชั่วคราว — เครื่องที่ติดตั้งรุ่นก่อนจะอัปเดตทับไม่ได้ ต้องตั้ง Secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD"
          fi

          echo "===== apk-info.txt ====="
          cat "$INFO"

      - name: อัปโหลด APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: taxi-meter-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: อัปโหลดกุญแจเซ็นแอปสำหรับตั้งค่า Secrets (ครั้งแรกเท่านั้น)
        if: ${{ hashFiles('android-app/keys/keystore-password.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bootstrap
          path: |
            android-app/keys/keystore.jks.base64
            android-app/keys/keystore-password.txt
          retention-days: 1

      - name: แนบ APK ไว้ใน Release "apk-latest" (ลิงก์ถาวร)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest \
              --title "ค่าแท็กซี่ — APK ล่าสุด" \
              --notes "ดาวน์โหลดไฟล์ .apk แล้วติดตั้งบนมือถือ Android (อนุญาตติดตั้งจากแหล่งที่ไม่รู้จัก)"
          fi
          # ⚠️ Release สร้างไปแล้วรอบแรกด้วยชื่อเดิม ⇒ ต้องสั่งแก้ชื่อทุกครั้ง ไม่งั้นหน้าดาวน์โหลดจะค้างชื่อเก่า
          gh release edit apk-latest --title "ค่าแท็กซี่ — APK ล่าสุด" \
            --notes "ดาวน์โหลดไฟล์ .apk แล้วติดตั้งบนมือถือ Android (อนุญาตติดตั้งจากแหล่งที่ไม่รู้จัก)" || true
          gh release upload apk-latest android-app/app/build/outputs/apk/release/*.apk --clobber

          # ข้อมูลของไฟล์ (ชื่อแอป · ไอคอน · sha256 · เวลาสร้าง) — ให้ตรวจได้โดยไม่ต้องติดตั้ง
          if [ -f android-app/app/build/outputs/apk/release/apk-info.txt ]; then
            gh release upload apk-latest android-app/app/build/outputs/apk/release/apk-info.txt --clobber
          fi

          # 🧹 ลบไฟล์ที่ไม่ถูกเซ็นที่ค้างจากรอบก่อน — กันคนกดโหลดผิดไฟล์ไปติดตั้งไม่ได้
          for a in $(gh release view apk-latest --json assets --jq '.assets[].name' 2>/dev/null); do
            case "$a" in
              *unsigned*) echo "ลบไฟล์เก่าที่ใช้ไม่ได้: $a"; gh release delete-asset apk-latest "$a" -y || true ;;
            esac
          done
          echo "--- ไฟล์ใน Release ตอนนี้ ---"
          gh release view apk-latest --json assets --jq '.assets[] | "\(.name)  \(.size) ไบต์\n\(.url)"'

      - name: สรุปวิธีใช้งาน
        if: always()
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          MADE_KEY="ไม่"
          if [ -f android-app/keys/keystore-password.txt ]; then MADE_KEY="ใช่"; fi
          {
            echo "## 📱 ผลการสร้าง APK"
            echo ""
            echo "- APK: ดู artifact **taxi-meter-apk** หรือ Release **apk-latest**"
            echo "- สร้างกุญแจเซ็นแอปใหม่รอบนี้: **$MADE_KEY**"
            echo ""
            if [ "$MADE_KEY" = "ใช่" ]; then
              echo "### ⚠️ ต้องทำครั้งเดียว (ไม่งั้นอัปเดตแอปทับของเดิมไม่ได้)"
              echo "1. ดาวน์โหลด artifact **keystore-bootstrap** (มี 2 ไฟล์)"
              echo "2. เปิดไฟล์ \`keystore.jks.base64\` คัดลอกข้อความทั้งหมด"
              echo "3. Repo → Settings → Secrets and variables → Actions → New repository secret"
              echo "   - ชื่อ \`KEYSTORE_BASE64\` ค่า = ข้อความที่คัดลอกมา"
              echo "   - ชื่อ \`KEYSTORE_PASSWORD\` ค่า = รหัสในไฟล์ \`keystore-password.txt\`"
              echo "4. **ลบ artifact keystore-bootstrap ทิ้ง** (อย่าให้กุญแจค้างอยู่ที่ไหน)"
              echo ""
              echo "ตั้ง Secret แล้วรันงานนี้อีกครั้ง → APK จะเซ็นด้วยกุญแจเดิมตลอดไป"
            else
              echo "ลายเซ็นถาวรพร้อมใช้ — ติดตั้งทับเวอร์ชันก่อนได้เลยไม่ต้องถอนก่อน"
            fi
            echo ""
            echo "### 🔄 อัปเดตแอปครั้งต่อไป"
            echo "- แก้ \`index.html\` (เว็บ) → เพิ่มบนเว็บ = ในแอปเห็นทันที **ไม่ต้อง build APK ใหม่**"
            echo "- แก้ \`android-app/\` (ชั้น Android) → รันงานนี้ใหม่อีกครั้ง"
          } >> "$GITHUB_STEP_SUMMARY"
